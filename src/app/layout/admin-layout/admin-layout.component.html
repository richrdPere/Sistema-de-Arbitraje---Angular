<!-- ================================================= -->
<!-- LAYOUT ADMIN -->
<!-- ================================================= -->
<div class="min-h-screen bg-base-200 text-base-content">

  <!-- ================================================= -->
  <!-- DRAWER -->
  <!-- ================================================= -->
  <div class="drawer bg-base-200 text-base-content lg:drawer-open">

    <!-- Control del menú lateral -->
    <input #adminDrawer [id]="drawerId" type="checkbox" class="drawer-toggle" aria-label="Mostrar menú principal" />

    <!-- ================================================= -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ================================================= -->
    <div class="drawer-content flex min-h-screen min-w-0 flex-col">

      <!-- Navbar -->
      <navbar-admin [drawerId]="drawerId"></navbar-admin>

      <!-- Páginas de las rutas hijas -->
      <main id="admin-main-content" class="min-w-0 flex-1">
        <div class="min-h-full min-w-0
                 px-4 py-5 sm:px-6 sm:py-6
                 lg:px-8 lg:py-8">
          <router-outlet></router-outlet>
        </div>
      </main>

      <!-- Footer -->
      <footer-admin></footer-admin>
    </div>

    <!-- ================================================= -->
    <!-- SIDEBAR -->
    <!-- drawer-side ya está declarado en su host -->
    <!-- ================================================= -->
    <sidebar-admin [drawerId]="drawerId" (closeRequested)="adminDrawer.checked = false"></sidebar-admin>
  </div>

</div>
