<header class="border-b border-base-300
         bg-base-100/95 text-base-content
         shadow-sm backdrop-blur">

  <div class="flex min-h-16 items-center gap-3
                 px-4 sm:px-6 lg:px-8">

    <!-- Abrir menú móvil -->
    <label [attr.for]="drawerId" class="btn btn-square btn-ghost lg:hidden" aria-label="Abrir menú principal">
      <i class="fa-solid fa-bars text-lg" aria-hidden="true"></i>
    </label>

    <!-- Identificación -->
    <div class="min-w-0">
      <p class="truncate text-sm font-bold sm:text-base">
        Sistema de Arbitraje
      </p>

      <p class="hidden truncate text-xs text-base-content/55 sm:block">
        Gestión y trazabilidad de expedientes
      </p>
    </div>

    <!-- Acciones del header -->
    <div class="ml-auto flex items-center gap-1 sm:gap-2">

      <!-- Cambiar tema -->
      <button type="button" class="btn btn-square btn-ghost btn-sm
                     sm:btn-md" [attr.aria-label]="
                isDarkMode()
                  ? 'Activar tema claro'
                  : 'Activar tema oscuro'
              " (click)="toggleTheme()">

        @if (isDarkMode()) {
        <i class="fa-regular fa-sun text-lg"></i>
        } @else {
        <i class="fa-regular fa-moon text-lg"></i>
        }
      </button>

      <!-- Usuario -->
      <div class="dropdown dropdown-end">
        <button type="button" tabindex="0" class="btn btn-ghost h-auto min-h-11 gap-3
                       rounded-xl px-2 sm:px-3">

          <div class="flex size-9 shrink-0 items-center
                         justify-center rounded-xl bg-info
                         text-xs font-bold text-info-content">

            {{ userInitials() }}
          </div>

          <div class="hidden min-w-0 text-left md:block">
            <p class="max-w-44 truncate text-sm
                           font-semibold">

              {{ userName() }}
            </p>

            <p class="max-w-44 truncate text-[11px]
                           text-base-content/55">

              {{ userRole() }}
            </p>
          </div>

          <i class="fa-solid fa-chevron-down
                         hidden text-[10px]
                         text-base-content/50 md:block">
          </i>
        </button>

        <ul tabindex="0" class="menu dropdown-content z-50 mt-3
                       w-64 rounded-2xl border
                       border-base-300 bg-base-100
                       p-2 shadow-xl">

          <li class="menu-title px-3 py-2">
            <span>Mi cuenta</span>
          </li>

          <!-- <li>
            <button type="button" (click)="navigateToProfile()">

              <i class="fa-regular fa-user"></i>
              Mi perfil
            </button>
          </li> -->

          <li>
            <button type="button" (click)="navigateToSettings()">

              <i class="fa-solid fa-gear"></i>
              Configuración
            </button>
          </li>

          <li>
            <button type="button" (click)="toggleTheme()">

              @if (isDarkMode()) {
              <i class="fa-regular fa-sun"></i>
              Usar tema claro
              } @else {
              <i class="fa-regular fa-moon"></i>
              Usar tema oscuro
              }
            </button>
          </li>

          <li>
            <hr class="my-1 border-base-300" />
          </li>

          <li>
            <button type="button" class="text-error" [disabled]="closingSession()" [attr.aria-busy]="closingSession()"
              (click)="logout()">
              @if (closingSession()) {
              <span class="loading loading-spinner loading-sm" aria-hidden="true"></span>

              Cerrando sesión...
              } @else {
              <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>

              Cerrar sesión
              }
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
