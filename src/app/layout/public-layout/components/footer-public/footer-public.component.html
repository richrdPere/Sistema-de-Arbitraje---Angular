<footer class="w-full border-t border-base-300
         bg-base-100 text-base-content" aria-label="Pie de página">
  <div class="mx-auto grid w-full max-w-screen-2xl
           grid-cols-1 gap-x-8 gap-y-10
           px-4 py-10
           sm:grid-cols-2 sm:px-6
           lg:grid-cols-4 lg:px-8 lg:py-12">
    <!-- ================================================= -->
    <!-- SECCIONES Y ENLACES -->
    <!-- ================================================= -->
    @for (section of footerSections; track section.title) {
    <nav class="flex min-w-0 flex-col items-center
               gap-4 text-center
               sm:items-start sm:text-left" [attr.aria-label]="section.title">
      <h2 class="text-sm font-bold uppercase
                 tracking-wider text-base-content/70">
        {{ section.title }}
      </h2>

      <ul class="flex w-full min-w-0 flex-col
                 items-center gap-1 sm:items-start">
        @for (link of section.links; track link.path) {
        <li class="min-w-0 max-w-full">
          <a [routerLink]="link.path" routerLinkActive="text-primary font-semibold" #activeLink="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" [ngClass]="{
    'text-base-content/75': !activeLink.isActive
  }" class="link link-hover inline-flex min-h-11
         max-w-full items-center justify-center
         whitespace-normal break-words
         rounded-md px-2 py-2 text-sm
         leading-relaxed
         transition-colors duration-200
         hover:text-primary
         focus-visible:outline-none
         focus-visible:ring-2
         focus-visible:ring-primary
         focus-visible:ring-offset-2
         focus-visible:ring-offset-base-100
         sm:justify-start">
            {{ link.label }}
          </a>
        </li>
        }
      </ul>
    </nav>
    }

    <!-- ================================================= -->
    <!-- REDES SOCIALES -->
    <!-- ================================================= -->
    <nav class="flex min-w-0 flex-col items-center
             gap-4 text-center
             sm:items-start sm:text-left" aria-label="Redes sociales">
      <h2 class="text-sm font-bold uppercase
               tracking-wider text-base-content/70">
        Redes sociales
      </h2>

      <div class="flex flex-wrap items-center
               justify-center gap-3 sm:justify-start">
        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer"
          aria-label="Visitar LinkedIn, abre en una pestaña nueva" class="btn btn-circle btn-ghost
                 text-base-content/70
                 transition-colors duration-200
                 hover:bg-primary/10 hover:text-primary
                 focus-visible:outline-none
                 focus-visible:ring-2
                 focus-visible:ring-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"
            aria-hidden="true">
            <path
              d="M20.451 20.451h-3.554v-5.569c0-1.328-.027-3.039-1.852-3.039-1.853 0-2.136 1.447-2.136 2.942v5.666H9.355V9h3.414v1.561h.047c.476-.9 1.637-1.852 3.369-1.852 3.602 0 4.266 2.372 4.266 5.456v6.286zM5.337 7.433a2.064 2.064 0 1 1 0-4.128 2.064 2.064 0 0 1 0 4.128zM3.56 20.451h3.555V9H3.56v11.451zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z" />
          </svg>
        </a>

        <!-- X -->
        <a href="https://x.com/" target="_blank" rel="noopener noreferrer"
          aria-label="Visitar X, abre en una pestaña nueva" class="btn btn-circle btn-ghost
                 text-base-content/70
                 transition-colors duration-200
                 hover:bg-primary/10 hover:text-primary
                 focus-visible:outline-none
                 focus-visible:ring-2
                 focus-visible:ring-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"
            aria-hidden="true">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26L22 21.75h-6.57l-5.144-6.69-5.887 6.69H1.09l7.73-8.78L2 2.25h6.68l4.65 6.066L18.244 2.25zM16.96 19.44h1.834L7.12 4.444H5.17L16.96 19.44z" />
          </svg>
        </a>

        <!-- Facebook -->
        <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer"
          aria-label="Visitar Facebook, abre en una pestaña nueva" class="btn btn-circle btn-ghost
                 text-base-content/70
                 transition-colors duration-200
                 hover:bg-primary/10 hover:text-primary
                 focus-visible:outline-none
                 focus-visible:ring-2
                 focus-visible:ring-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"
            aria-hidden="true">
            <path
              d="M9 8H6v4h3v12h5V12h3.642L18 8h-4V6.333C14 5.378 14.192 5 15.115 5H18V0h-3.808C10.596 0 9 1.583 9 4.615V8z" />
          </svg>
        </a>
      </div>
    </nav>
  </div>

  <!-- ================================================= -->
  <!-- FRANJA INFERIOR -->
  <!-- ================================================= -->
  <div class="border-t border-base-300">
    <div class="mx-auto flex w-full max-w-screen-2xl
             flex-col items-center justify-center
             px-4 py-5 text-center sm:px-6 lg:px-8">
      <p class="max-w-full break-words text-xs
               leading-relaxed text-base-content/60 sm:text-sm">
        © {{ currentYear }} Sistema de Arbitraje.
        Todos los derechos reservados.
      </p>
    </div>
  </div>
</footer>
